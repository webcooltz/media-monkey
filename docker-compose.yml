services:
  media-monkey:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_PATH=/app/server/data/media.db
      - CLEANVID_ENABLED=false
      # Supply API keys here or via an .env file next to this compose file:
      # - TMDB_API_KEY=
      # - OMDB_API_KEY=
      # - OPENSUBTITLES_API_KEY=
    volumes:
      # Persist the SQLite catalog across restarts
      - ./server/data:/app/server/data
      # Mount your media libraries read-only, then point Settings paths at these.
      # Edit the host paths to match your machine:
      # - "D:/Movies:/media/Movies:ro"
      # - "D:/TV Shows:/media/TV Shows:ro"
      # - "E:/Music:/media/Music:ro"
      # - "E:/Audiobooks:/media/Audiobooks:ro"
    restart: unless-stopped
